name: Refresh verified catalysts

on:
  schedule:
    # Scan at most 100 least-recently-covered artists per run, so larger rosters rotate fairly.
    # Avoid the hourly rush and the deep news scan at :15. GitHub scheduling
    # remains best-effort; inspect actual run timestamps when auditing freshness.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover catalysts and refresh affected quotes
        env:
          MARKET_UPDATE_SECRET: ${{ secrets.MARKET_UPDATE_SECRET }}
        run: |
          if [ -z "$MARKET_UPDATE_SECRET" ]; then
            echo "Add MARKET_UPDATE_SECRET in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          rmi_response_file="$(mktemp)"
          trap 'rm -f "$rmi_response_file"' EXIT

          # Recover a missed midnight opening before refreshing intraday quotes.
          # The endpoint skips immediately once today's verified daily run exists.
          curl --output "$rmi_response_file" --fail-with-body --silent --show-error --max-time 295 \
            --header "x-market-update-secret: $MARKET_UPDATE_SECRET" \
            https://rap-market-index.vercel.app/api/cron/release-window
          if ! jq -e 'type == "object" and .ok == true' "$rmi_response_file" > /dev/null; then
            echo "Daily opening did not return a verified success response."
            exit 1
          fi
          if ! jq -e '.skipped == true' "$rmi_response_file" > /dev/null; then
            jq '{ok, runDate, recoveredDailyOpening: true}' "$rmi_response_file"
            exit 0
          fi

          curl --output "$rmi_response_file" --fail-with-body --silent --show-error --max-time 420 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            --header "x-market-update-secret: $MARKET_UPDATE_SECRET" \
            https://rap-market-index.vercel.app/api/cron/catalyst-refresh

          if ! jq -e 'type == "object" and .ok == true' "$rmi_response_file" > /dev/null; then
            echo "Automation did not return a verified success response."
            exit 1
          fi
          jq '{ok, runDate, skipped, recalculatedArtistCount, scannedArtistCount, persisted,
            quoteChangeCount: .marketUpdate.quoteChangeCount,
            priceTickCount: .marketUpdate.priceTickCount,
            error, warningCount: ((.warnings // .marketUpdate.warnings // []) | length)}' "$rmi_response_file"
